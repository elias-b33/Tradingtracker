<title>Nasdaq-läget 30 oktober</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: terminal-style report — sticky tab bar + market strip over a 1180px column; numbers in mono, prose in Plex Sans (Aether palette) */
:root{
  --bg:#000000; --surface:#131722; --elev:#1e222d; --fg:#d1d4dc; --muted:#8b8f9a; --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
  --accent:#5b86f5; --accent-bg:rgba(55,108,240,.16); --up:#1fae95; --down:#f5505c; --warn:#ffa31a; --info:#5b86f5;
  --up-bg:rgba(8,153,129,.16); --down-bg:rgba(242,54,69,.15); --warn-bg:rgba(255,152,0,.15); --info-bg:rgba(55,108,240,.16); --neutral-bg:rgba(139,143,154,.14);
  --zone:rgba(8,153,129,.18); --grid:rgba(255,255,255,.06);
  --f-sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f4f5f8; --surface:#ffffff; --elev:#eceef3; --fg:#131722; --muted:#5a5e6a; --border:rgba(19,23,34,.10); --border2:rgba(19,23,34,.2);
  --accent:#2453d6; --accent-bg:rgba(41,98,255,.10); --up:#04745f; --down:#c81f31; --warn:#a65400; --info:#2453d6;
  --up-bg:rgba(4,116,95,.10); --down-bg:rgba(200,31,49,.09); --warn-bg:rgba(166,84,0,.10); --info-bg:rgba(36,83,214,.09); --neutral-bg:rgba(90,94,106,.10);
  --zone:rgba(4,116,95,.13); --grid:rgba(19,23,34,.07); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f4f5f8; --surface:#ffffff; --elev:#eceef3; --fg:#131722; --muted:#5a5e6a; --border:rgba(19,23,34,.10); --border2:rgba(19,23,34,.2);
  --accent:#2453d6; --accent-bg:rgba(41,98,255,.10); --up:#04745f; --down:#c81f31; --warn:#a65400; --info:#2453d6;
  --up-bg:rgba(4,116,95,.10); --down-bg:rgba(200,31,49,.09); --warn-bg:rgba(166,84,0,.10); --info-bg:rgba(36,83,214,.09); --neutral-bg:rgba(90,94,106,.10);
  --zone:rgba(4,116,95,.13); --grid:rgba(19,23,34,.07); color-scheme:light; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-cond);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:24px;line-height:1.2} h3{font-size:17px;line-height:1.3}
p{margin:0;text-wrap:pretty}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--border)}
.top .row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.top h1{font-size:20px}
.top .asof{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:500 13px var(--f-sans);padding:10px 10px 11px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.strip{border-bottom:1px solid var(--border);background:var(--bg)}
.strip .wrap{display:flex;gap:18px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tk{display:flex;gap:6px;align-items:baseline;white-space:nowrap;font-size:12px}
.tk b{font-weight:500;color:var(--muted);font-family:var(--f-sans)}
main{padding-block:24px 64px}
section[data-view]{display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-sans);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--up-bg);color:var(--up)} .pill.bad{background:var(--down-bg);color:var(--down)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.neutral{background:var(--neutral-bg);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
/* regime */
.regime{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:820px){.regime{grid-template-columns:1fr}}
.regime h2{font-size:30px;line-height:1.12}
.points{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--elev);border-radius:6px;padding:10px 12px}
.tile .v{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.plan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.plan .card h3{margin-bottom:6px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{font:500 11px var(--f-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--elev)}
tr.click{cursor:pointer}
tr.detail td{white-space:normal;background:var(--elev)}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--accent)}
.sym{font:600 13px var(--f-mono);color:var(--fg)}
.nm{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.sbar{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--grid);vertical-align:middle;position:relative;overflow:hidden}
.sbar i{position:absolute;top:0;bottom:0}
/* deep */
.deep{display:flex;flex-direction:column;gap:16px}
.dh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline}
.dh .big{font:500 26px var(--f-mono)}
.metrics{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.metric{background:var(--elev);border-radius:6px;padding:8px 10px}
.metric .v{font:500 15px var(--f-mono);margin-top:2px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.two > *{min-width:0}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block}
.ln-close{fill:none;stroke:var(--fg);stroke-width:1.6}
.ln-50{fill:none;stroke:var(--info);stroke-width:1.2;stroke-dasharray:4 3}
.ln-200{fill:none;stroke:var(--warn);stroke-width:1.2}
.zone{fill:var(--zone)}
.ln-stop{stroke:var(--down);stroke-width:1.2;stroke-dasharray:5 4}
.ln-tgt{stroke:var(--up);stroke-width:1;stroke-dasharray:2 4}
.gridl{stroke:var(--grid);stroke-width:1}
.ax{fill:var(--muted);font:11px var(--f-mono)}
.zl{fill:var(--up);font:600 11px var(--f-sans)} .sl{fill:var(--down);font:600 11px var(--f-sans)} .tl{fill:var(--up);font:11px var(--f-sans)}
.zl,.sl,.tl{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.lastdot{fill:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.spk{width:84px;height:24px;display:block}
.spk polyline{fill:none;stroke-width:1.4}
.spk .u{stroke:var(--up)} .spk .d{stroke:var(--down)}
.scen td{white-space:normal}
.ev{font:600 16px var(--f-mono)}
.src{font-size:12px;color:var(--muted)}
/* picks */
.pgroup{display:flex;flex-direction:column;gap:10px}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.pick .lv{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted)}
.pick .lv b{color:var(--fg);font-weight:500}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search],.controls select{background:var(--surface);color:var(--fg);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font:13px var(--f-sans);min-width:0}
.controls input[type=search]{flex:1 1 200px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.btn{appearance:none;background:var(--elev);color:var(--fg);border:1px solid var(--border2);border-radius:6px;padding:8px 14px;font:500 13px var(--f-sans);cursor:pointer}
.btn:hover{border-color:var(--accent)}
/* course */
.course{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.course{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto;font-size:13px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}
.toc a.h1{color:var(--fg);font-weight:600;margin-top:10px}
.prose{max-width:760px;min-width:0}
.prose h1{font-size:28px;margin:34px 0 10px;padding-top:8px;border-top:1px solid var(--border)}
.prose h1:first-child{margin-top:0;border-top:0}
.prose h2{font-size:20px;margin:26px 0 8px}
.prose p,.prose li{line-height:1.65}
.prose p{margin:10px 0}
.prose ul,.prose ol{padding-left:20px;margin:10px 0;display:flex;flex-direction:column;gap:5px}
.prose table{margin:12px 0;display:block;overflow-x:auto;border:1px solid var(--border);border-radius:6px}
.prose td,.prose th{white-space:normal;min-width:90px}
.prose strong{color:var(--fg);font-weight:600}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px}
@media (max-width:560px){ h2{font-size:21px} .regime h2{font-size:24px} .dh .big{font-size:22px} th,td{padding:6px 8px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="row"><h1>Nasdaq-läget</h1><span class="asof" id="asof"></span></div>
    <nav class="tabs" role="tablist" aria-label="Rapportens delar">
      <button class="tab" role="tab" data-go="lage">Läget</button>
      <button class="tab" role="tab" data-go="djup">Reddit · Intel · Amazon</button>
      <button class="tab" role="tab" data-go="kop">Köplägen</button>
      <button class="tab" role="tab" data-go="ndx">Nasdaq-100</button>
      <button class="tab" role="tab" data-go="alla">Hela Nasdaq</button>

<div class="strip"><div class="wrap" id="strip"></div></div>
<main class="wrap" id="app">
  <section data-view="lage" id="v-lage"></section>
  <section data-view="djup" id="v-djup" hidden></section>
  <section data-view="kop" id="v-kop" hidden></section>
  <section data-view="ndx" id="v-ndx" hidden></section>
  <section data-view="alla" id="v-alla" hidden></section>
  <section data-view="skola" id="v-skola" hidden></section>
  <section data-view="metod" id="v-metod" hidden></section>
</main>
<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const ROWS = P.rows.map(r => { const o = {}; P.cols.forEach((c, i) => o[c] = r[i]); return o; });
const BY = Object.fromEntries(ROWS.map(r => [r.s, r]));
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NF = {};
function nf(d){ return NF[d] || (NF[d] = new Intl.NumberFormat("sv-SE", {minimumFractionDigits:d, maximumFractionDigits:d})); }
function num(x, d){ return x == null ? "–" : nf(d == null ? 2 : d).format(x); }
function money(x){ if (x == null) return "–"; return nf(x >= 1000 ? 0 : 2).format(x) + " $"; }
function pct(x, d){ if (x == null) return "–"; const v = x * 100; return (v > 0 ? "+" : "") + nf(d == null ? 1 : d).format(v) + " %"; }
function cls(x){ return x == null ? "" : x > 0 ? "up" : x < 0 ? "down" : ""; }
function cap(x){ if (!x) return "–"; if (x >= 1e12) return nf(2).format(x/1e12) + " bilj. $"; if (x >= 1e9) return nf(x >= 1e11 ? 0 : 1).format(x/1e9) + " mdr $"; return nf(0).format(x/1e6) + " mn $"; }
const SETUP = {
  BREAKOUT:["Utbrott","good"], NEAR_PIVOT:["Nära utbrott","info"], PULLBACK:["Rekyl – köpläge","good"], OVERSOLD_UP:["Översåld i upptrend","good"],
  RECOVERY:["Trendvändning","info"], STRONG:["Stark – vänta på rekyl","info"], EXTENDED:["Sträckt","warn"], DOWNTREND:["Nedtrend","bad"],
  NEUTRAL:["Neutral","neutral"], NEW:["Ny notering","neutral"], SHOCK:["Kursras","bad"], LOCKED:["Låst kurs","neutral"]
};
function setupPill(k){ const s = SETUP[k] || [k, "neutral"]; return `<span class="pill ${s[1]}"><span class="dot"></span>${esc(s[0])}</span>`; }
function pill(text, tone){ return `<span class="pill ${tone || "neutral"}"><span class="dot"></span>${esc(text)}</span>`; }
function inZone(r){ if (r.zl == null) return false; const a = (r.atrp || 0.03) * r.p; return r.p >= r.zl - 0.25*a && r.p <= r.zh + 0.25*a; }
function isBuy(r){
  if (r.mc < 2e9 || (r.dv || 0) < 2e7) return false;
  if (["PULLBACK","BREAKOUT","OVERSOLD_UP"].includes(r.set)) return inZone(r) && (r.rr || 0) >= 1.5;
  if (r.set === "NEAR_PIVOT") return r.trg && r.p >= r.trg * 0.97;
  return false;
}

/* ---------- charts ---------- */
function sma(a, n){ const out = new Array(a.length).fill(null); let s = 0; for (let i = 0; i < a.length; i++){ s += a[i]; if (i >= n) s -= a[i-n]; if (i >= n-1) out[i] = s/n; } return out; }
function lineChart(sym, lv){
  const full = P.charts[sym]; if (!full) return "";
  const s50 = sma(full, 50), s200 = sma(full, 200);
  const N = Math.min(260, full.length), off = full.length - N;
  const c = full.slice(off), a50 = s50.slice(off), a200 = s200.slice(off);
  const W = 760, H = 270, pl = 6, pr = 64, pt = 12, pb = 18;
  let vals = c.concat(a50.filter(v => v != null), a200.filter(v => v != null));
  const lvl = [];
  if (lv){ (lv.zones || []).forEach(z => lvl.push(z[0], z[1])); (lv.stops || []).forEach(s => lvl.push(s[0])); (lv.targets || []).forEach(t => lvl.push(t)); }
  vals = vals.concat(lvl);
  let lo = Math.min(...vals), hi = Math.max(...vals); const padv = (hi - lo) * 0.06; lo -= padv; hi += padv;
  const x = i => pl + (W - pl - pr) * i / (N - 1), y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const path = arr => { let d = ""; arr.forEach((v, i) => { if (v == null) return; d += (d ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); }); return d; };
  let g = "";
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo) * k / 4; g += `<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${W-pr+6}" y="${(y(v)+4).toFixed(1)}">${num(v, v >= 1000 ? 0 : v >= 100 ? 0 : 1)}</text>`; }
  let z = "";
  if (lv){
    (lv.zones || []).forEach(q => { const y1 = y(q[1]), y2 = y(q[0]); z += `<rect class="zone" x="${pl}" width="${W-pl-pr}" y="${y1.toFixed(1)}" height="${Math.max(2, y2-y1).toFixed(1)}"/><text class="zl" x="${pl+6}" y="${(y1+13).toFixed(1)}">${esc(q[2])} ${num(q[0],0)}–${num(q[1],0)}</text>`; });
    (lv.stops || []).forEach(q => { const yy = y(q[0]); z += `<line class="ln-stop" x1="${pl}" x2="${W-pr}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="sl" x="${W-pr-150}" y="${(yy-4).toFixed(1)}">${esc(q[1])} ${num(q[0], q[0] >= 100 ? 0 : 2)}</text>`; });
    (lv.targets || []).forEach(t => { const yy = y(t); z += `<line class="ln-tgt" x1="${pl}" x2="${W-pr}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="tl" x="${W-pr-90}" y="${(yy-4).toFixed(1)}">Mål ${num(t, t >= 100 ? 0 : 2)}</text>`; });
  }
  const last = c[c.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kursgraf ${esc(sym)} senaste året med 50- och 200-dagars medelvärde">${g}${z}<path class="ln-200" d="${path(a200)}"/><path class="ln-50" d="${path(a50)}"/><path class="ln-close" d="${path(c)}"/><circle class="lastdot" cx="${x(N-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.5"/></svg>
  <div class="legend"><span><i style="border-color:var(--fg)"></i>Kurs</span><span><i style="border-color:var(--info);border-top-style:dashed"></i>50-dagars</span><span><i style="border-color:var(--warn)"></i>200-dagars</span>${lv ? '<span><i style="border-color:var(--up)"></i>Köpzon / mål</span><span><i style="border-color:var(--down);border-top-style:dashed"></i>Stop</span>' : ""}</div>`;
}
function levelsFromRow(r){
  if (!r) return null; const o = {zones:[], stops:[], targets:[]};
  if (r.zl != null) o.zones.push([r.zl, r.zh, r.set === "NEAR_PIVOT" ? "Utbrottszon" : "Köpzon"]);
  if (r.st != null) o.stops.push([r.st, "Stop"]);
  if (r.t1 != null) o.targets.push(r.t1);
  return o;
}
function spark(sym){
  const a = P.spark[sym]; if (!a || a.length < 3) return "";
  const lo = Math.min(...a), hi = Math.max(...a), W = 84, H = 24;
  const pts = a.map((v, i) => (i * (W-2) / (a.length-1) + 1).toFixed(1) + "," + (H - 2 - (H-4) * (v - lo) / ((hi - lo) || 1)).toFixed(1)).join(" ");
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline class="${a[a.length-1] >= a[0] ? "u" : "d"}" points="${pts}"/></svg>`;
}

/* ---------- strip ---------- */
function renderStrip(){
  const items = [["QQQ","Nasdaq-100 (QQQ)"],["^IXIC","Composite"],["SPY","S&P 500 (SPY)"],["IWM","Småbolag"],["SMH","Halvledare"],["^VIX","VIX"],["^TNX","10-årsränta"],["CL=F","Olja WTI"],["GLD","Guld (GLD)"],["BTC-USD","Bitcoin"],["DX-Y.NYB","Dollarindex"]];

    });

  const sw = ["VRTX","KDP","MANH","ROST"];
  h += `<div class="stack"><h2 style="font-size:20px">Grafer för swingkandidaterna</h2><div class="two">${sw.map(s => `<div class="card stack"><h3>${s} <span class="muted" style="font-weight:400">${esc(BY[s] ? BY[s].n : "")}</span></h3>${lineChart(s, levelsFromRow(BY[s]))}</div>`).join("")}</div></div>`;

  });

function renderAllTable(){
  const mc = +F.mc;
  let rows = ROWS.filter(r => (r.mc || 0) >= mc && (!F.sec || r.sec === F.sec) && (!F.set || r.set === F.set) && (!F.buy || isBuy(r)) && (!F.q || r.s.toLowerCase().startsWith(F.q) || (r.n || "").toLowerCase().includes(F.q)));
  const k = F.sort, dir = F.dir;
  rows.sort((a, b) => { const x = a[k], y = b[k]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  const cols = [["s","Aktie",""],["sec","Sektor",""],["mc","Börsvärde","r"],["p","Kurs","r"],["d1","Idag","r"],["m1","1 mån","r"],["ytd","I år","r"],["fh","Från topp","r"],["rsi","RSI","r"],["rs","RS","r"],["tt","Trend","r"],["set","Läge",""],["sc","Poäng","r"]];
  let h = `<p class="muted" style="margin-bottom:8px">${rows.length.toLocaleString("sv-SE")} träffar</p><div class="tw"><table><thead><tr><th></th>${cols.map(([c, l, a]) => `<th class="${a}"><button data-asort="${c}">${esc(l)}${F.sort === c ? (dir > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead><tbody>`;
  rows.slice(0, F.limit).forEach(r => {
    h += `<tr class="click" data-arow="${r.s}"><td>${spark(r.s)}</td><td><span class="sym">${esc(r.s)}</span> <span class="nm">${esc(r.n)}</span></td><td class="muted">${esc(r.sec)}</td><td class="num r">${cap(r.mc)}</td><td class="num r">${money(r.p)}</td><td class="num r ${cls(r.d1)}">${pct(r.d1)}</td><td class="num r ${cls(r.m1)}">${pct(r.m1,0)}</td><td class="num r ${cls(r.ytd)}">${pct(r.ytd,0)}</td><td class="num r ${cls(r.fh)}">${pct(r.fh,0)}</td><td class="num r">${num(r.rsi,0)}</td><td class="num r">${r.rs ?? "–"}</td><td class="num r">${r.tt == null ? "–" : r.tt + "/8"}</td><td>${setupPill(r.set)}</td><td class="num r">${r.sc}</td></tr>`;
    if (allOpen.has(r.s)){ const f = P.fund[r.s]; h += `<tr class="detail"><td colspan="14"><div class="stack"><p><strong>${esc(r.n)}</strong> · ${esc(r.ind)}${r.ndx ? " · Nasdaq-100" : ""}</p><p>${esc(r.desc)}</p><p class="mono muted" style="font-size:12px">20/50/200-dagars: –/${money(r.s50)}/${money(r.s200)} · 52v ${money(r.lo)}–${money(r.hi)} · ATR ${pct(r.atrp)} · Omsättning ${cap(r.dv)}/dag${f && f.fpe2 ? " · P/E nästa år " + num(f.fpe2,1) : ""}${f && f.tgt_up != null ? " · Riktkurs " + pct(f.tgt_up,0) : ""}</p><a href="https://www.nasdaq.com/market-activity/stocks/${esc(r.s.toLowerCase())}" target="_blank" rel="noopener">Öppna på Nasdaq.com</a></div></td></tr>`; }
  });
  h += `</tbody></table></div>`;
  if (rows.length > F.limit) h += `<div style="margin-top:12px"><button class="btn" id="more">Visa 50 till (${(rows.length - F.limit).toLocaleString("sv-SE")} kvar)</button></div>`;
  $("#all-table").innerHTML = h;
  const m = $("#more"); if (m) m.addEventListener("click", () => { F.limit += 50; renderAllTable(); });
}

/* ---------- Skola + Metod ---------- */
function renderSkola(){
  const toc = P.toc.map(t => `<a class="h1" href="#${t.id}" data-toc="${t.id}">${esc(t.name)}</a>` + t.children.map(c => `<a href="#${c.id}" data-toc="${c.id}">${esc(c.name)}</a>`).join("")).join("");
  $("#v-skola").innerHTML = `<div class="stack"><h2>Skola: allt du behöver kunna</h2><p class="muted">Hela kursen från chatten (del 1–4), samlad på ett ställe. Exemplen kopplar till bolagen i rapporten.</p></div><div class="course"><nav class="toc" aria-label="Innehåll">${toc}</nav><div class="prose">${P.course}</div></div>`;
}
function renderMetod(){
  $("#v-metod").innerHTML = `<div class="stack"><h2>Metod och källor</h2></div><div class="grid">${P.method.map(([t, d]) => `<div class="card"><h3>${esc(t)}</h3><p style="margin-top:6px">${esc(d)}</p></div>`).join("")}</div><p class="disclaimer">Analys och utbildning – inte personlig finansiell rådgivning. Data: Nasdaq.com (screener, analytikerdata, finansiella rapporter via Zacks), Yahoo Finance (kurser), bolagens SEC-rapporter och nyhetskällor som länkas i Djupdykningar. ${esc(P.asof)}.</p>`;
}

/* ---------- router + events ---------- */
const VIEWS = ["lage","djup","kop","ndx","alla","skola","metod"];
const done = {};
const RENDER = {lage: renderLage, djup: renderDeep, kop: renderPicks, ndx: renderNdx, alla: renderAllShell, skola: renderSkola, metod: renderMetod};
function show(v, scroll){
  if (!VIEWS.includes(v)) v = "lage";
  if (!done[v]){ RENDER[v](); done[v] = true; }
  VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; });
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.go === v ? "true" : "false"));
  if (scroll) window.scrollTo(0, 0);
}
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("k-")){ show("skola"); const el = document.getElementById(h); if (el) el.scrollIntoView(); return; }
  show(VIEWS.includes(h) ? h : "lage", true);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]"); if (t){ location.hash = t.dataset.go; return; }
  const ns = e.target.closest("[data-nsort]"); if (ns){ const k = ns.dataset.nsort; ndxSort = {k, dir: ndxSort.k === k ? -ndxSort.dir : (k === "s" || k === "v" || k === "set" ? 1 : -1)}; renderNdx(); return; }
  const nr = e.target.closest("[data-nrow]"); if (nr && !e.target.closest("a")){ const s = nr.dataset.nrow; ndxOpen.has(s) ? ndxOpen.delete(s) : ndxOpen.add(s); renderNdx(); return; }
  const as = e.target.closest("[data-asort]"); if (as){ const k = as.dataset.asort; F.dir = F.sort === k ? -F.dir : (k === "s" || k === "sec" || k === "set" ? 1 : -1); F.sort = k; renderAllTable(); return; }
  const ar = e.target.closest("[data-arow]"); if (ar && !e.target.closest("a")){ const s = ar.dataset.arow; allOpen.has(s) ? allOpen.delete(s) : allOpen.add(s); renderAllTable(); return; }
  const qs = e.target.closest("[data-qset]"); if (qs){ F.set = qs.dataset.qset; F.limit = 50; const sel = $("#f-set"); if (sel) sel.value = F.set; renderAllTable(); return; }
});
$("#asof").textContent = P.asof;
renderStrip();
window.addEventListener("hashchange", route);
route();
})();
</script>
